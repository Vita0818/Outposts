source_repo: Vita0818/Kikaria
source_ref: main

target_subdir: Kikaria-Android
task_prompt_path: FORGIS_TASK.md

agent_backend: deepseek
model: deepseek-v4-pro
api_base: https://api.deepseek.com
api_format: openai-compatible

target_branch: forgis/kikaria-android-ui-layout-style
target_base_branch: main

run_log_path: Kikaria-Android/FORGIS_LOG.md

dry_run: false
run_agent: true
confirm_real_run: true

model_env:
  DEEPSEEK_API_KEY: DEEPSEEK_API_KEY

execution_mode: staged_translation

max_iterations: 360
max_tool_result_chars: 40000

strict_mode: false

validation_commands: []
success_checks: []

staged_translation:
  min_total_iterations: 160
  min_processed_units: 4
  max_units_per_run: 10

  phases:
    overview:
      min_iterations: 25
      max_iterations: 80

    per_file:
      min_iterations: 90
      max_iterations: 240

    stabilization:
      min_iterations: 25
      max_iterations: 80

  enforce_micro_phases: true
  require_source_read: true
  require_compare_report: true
  require_progress_update: true
  require_target_effect_or_deferred_reason: true

  per_file_micro_phases:
    enabled: true
    require_feed: true
    require_write: true
    require_compare_report: true
    require_revision: true

  low_impact_warning:
    enabled: true
    min_code_changed_paths: 1
    ignore_report_only_changes: true

  folder_batch_review:
    enabled: true
    max_bundle_chars: 80000
    require_after_folder_complete: true

  source_inventory:
    include_globs:
      - "README.md"
      - "SPEC.md"
      - "CODEX_CONTEXT.md"
      - "Kikaria/ContentView.swift"
      - "Kikaria/KikariaTypography.swift"
      - "Kikaria/KikariaAdaptiveLayout.swift"
      - "Kikaria/KikariaMathText.swift"
      - "Kikaria/KikariaMathFormulaView.swift"
      - "Kikaria/**/*.swift"
    exclude_globs:
      - ".git/**"
      - "**/.DS_Store"
      - "**/build/**"
      - "**/.gradle/**"
      - "**/DerivedData/**"
      - "**/node_modules/**"
      - "**/*.xcuserstate"
      - "**/*.xcworkspace/**"
      - "**/*.xcodeproj/project.xcworkspace/**"
      - "**/*.xcodeproj/xcuserdata/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.pdf"
      - "**/*.zip"
      - "**/*.lock"

  progress_files:
    plan: FORGIS_TRANSLATION_PLAN.md
    source_target_map: FORGIS_SOURCE_TARGET_MAP.md
    progress: FORGIS_TRANSLATION_PROGRESS.md
    compare_report_dir: FORGIS_COMPARE_REPORTS
